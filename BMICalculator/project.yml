# xcodegen spec for the BMICalculator rewrite.
#
# Generate:   DEVELOPER_DIR=/Applications/Xcode-26.2.0.app/Contents/Developer xcodegen generate
# Build:      DEVELOPER_DIR=/Applications/Xcode-26.2.0.app/Contents/Developer xcodebuild \
#               -project BMICalculator.xcodeproj -scheme BMICalculator \
#               -destination 'generic/platform=iOS Simulator' \
#               CODE_SIGNING_ALLOWED=NO build
#
# First-build strategy: APP + TESTS only (widget added once the app compiles),
# and NO GoogleMobileAds SPM package — AdsManager is #if canImport(GoogleMobileAds)
# guarded, so omitting it excludes the ad code and avoids an SPM fetch over the VPN.
# Signing disabled (simulator). App Group / HealthKit usage strings are provided so
# runtime degrades gracefully; the code already falls back when the App Group is absent.

name: BMICalculator
options:
  bundleIdPrefix: com.jdr
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal       # start permissive to surface only real errors; tighten later
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""

targets:
  BMICalculator:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
      - path: DesignSystem
      - path: Features
      - path: Services
      - path: Intents
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jdr.BMI
        PRODUCT_NAME: BMICalculator
        GENERATE_INFOPLIST_FILE: "YES"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.3"
        TARGETED_DEVICE_FAMILY: "1,2"        # iPhone + iPad
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_NSHealthShareUsageDescription: "BMI Calculator reads your height and weight from Health to prefill the calculator. Health data never leaves your device and is never used for ads."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "BMI Calculator can save your weight and BMI to Health after a calculation, if you choose."
        INFOPLIST_KEY_CFBundleURLTypes: ""   # URL scheme added via Info if needed; not required to compile

  BMICalculatorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: BMICalculator
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.jdr.BMI.Tests
