# xcodegen spec for the BMICalculator rewrite.
#
# Generate:   DEVELOPER_DIR=/Applications/Xcode-26.2.0.app/Contents/Developer xcodegen generate
# Build:      DEVELOPER_DIR=/Applications/Xcode-26.2.0.app/Contents/Developer xcodebuild \
#               -project BMICalculator.xcodeproj -scheme BMICalculator \
#               -destination 'generic/platform=iOS Simulator' \
#               CODE_SIGNING_ALLOWED=NO build
#
# The GoogleMobileAds SPM package is linked into the app target. The app ships
# BANNER-ONLY (AdsManager, `#if canImport(GoogleMobileAds)`): the capped interstitial
# is implemented but dormant until a production unit ID is set (AdUnit.prodInterstitial
# is nil). The health/ad firewall (Guideline 5.1.3) is enforced in code: NPA requests
# only, no health signal ever reaches the ad layer. Requires GADApplicationIdentifier
# in Info.plist (present); the real banner unit is wired, interstitial unit is TODO.
# Signing disabled (simulator). App Group / HealthKit usage strings are provided so
# runtime degrades gracefully; the code already falls back when the App Group is absent.

name: BMICalculator
options:
  bundleIdPrefix: com.jdr
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: "12.0.0"

settings:
  base:
    # Swift 5 language mode: Swift 6 mode hits a swift-frontend IRGen CRASH (an
    # Apple compiler bug) on an async/actor reabstraction thunk in SettingsView.
    # The code still uses @MainActor/@Observable so runtime concurrency safety is
    # intact; revisit Swift 6 mode after an Xcode update or by isolating that thunk.
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: BPW45ZHW4H
    CODE_SIGN_STYLE: Automatic

targets:
  BMICalculator:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
      - path: DesignSystem
      - path: Features
      - path: Services
      - path: Intents
      - path: BMIWidget/BMISharedStore.swift   # shared App-Group store (also in widget)
      - path: PrivacyInfo.xcprivacy            # App Store privacy manifest (resource)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jdr.BMI
        PRODUCT_NAME: BMICalculator
        GENERATE_INFOPLIST_FILE: "YES"
        # Partial Info.plist supplies CFBundleURLTypes (the bmicalculator:// scheme
        # the widget / Control Center / Siri deep-link into — it can't be expressed
        # as an INFOPLIST_KEY scalar). Xcode merges the generated keys + the
        # INFOPLIST_KEY_* values below on top of this file.
        INFOPLIST_FILE: Info.plist
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "2.0"
        TARGETED_DEVICE_FAMILY: "1,2"        # iPhone + iPad
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_NSHealthShareUsageDescription: "BMI Calculator reads your height and weight from Health to prefill the calculator. Health data never leaves your device and is never used for ads."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "BMI Calculator can save your weight and BMI to Health after a calculation, if you choose."
        # HealthKit capability — required for the Apple Health prefill to work
        # (usage strings above are not sufficient on their own).
        CODE_SIGN_ENTITLEMENTS: BMICalculator.entitlements
    dependencies:
      - target: BMIWidget            # embeds the widget extension into the app
      - package: GoogleMobileAds     # banner + capped interstitial (firewalled)
        product: GoogleMobileAds

  BMICalculatorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: BMICalculator
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.jdr.BMI.Tests

  # Widget + Control Center extension. Compiles the Foundation-only Core files
  # and the SwiftData-free intents directly (multi-target membership), so the
  # widget files use Core types in-module (no `import Core`).
  BMIWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: BMIWidget
        excludes:
          - Info.plist
          - BMIWidget.entitlements
      - path: Core/UnitSystem.swift
      - path: Core/HealthStandard.swift
      - path: Core/BMICategory.swift
      - path: Core/BMIResult.swift
      - path: Core/BMICalculator.swift
      - path: Intents/CalculateBMIIntent.swift
      - path: Intents/BMIResultEntity.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jdr.BMI.BMIWidget
        PRODUCT_NAME: BMIWidget
        INFOPLIST_FILE: BMIWidget/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        # App Group so the widget reads the snapshot/SwiftData the app shares.
        CODE_SIGN_ENTITLEMENTS: BMIWidget/BMIWidget.entitlements
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: "YES"

# Explicit scheme so `xcodebuild test` always finds the test action (auto-scheme
# generation got ambiguous once the widget became a 3rd target).
schemes:
  BMICalculator:
    build:
      targets:
        BMICalculator: all
        BMICalculatorTests: [test]
    test:
      config: Debug
      targets:
        - BMICalculatorTests
    run:
      config: Debug
      # Local StoreKit testing: the scheme loads this config so the "Remove Ads"
      # non-consumable (com.bmi.removeads @ $1.99) resolves and can be bought in
      # the simulator without App Store Connect / a sandbox account.
      storeKitConfiguration: Products.storekit
